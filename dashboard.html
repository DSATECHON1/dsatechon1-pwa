<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Dashboard</title>
<style>body{background:#0a0f1a;color:#fff;font-family:Arial;padding:20px;text-align:center}.card{background:#111a2a;padding:20px;border-radius:15px;margin:15px 0} #b{font-size:50px;color:#087cff}#btn{width:180px;height:180px;border-radius:50%;background:#087cff;color:#fff;border:none;font-size:18px}</style>
</head><body>
<div class="card"><h2 id="w">Welcome</h2><p>@<span id="u"></span> | Ref: <span id="r"></span></p></div>
<div class="card"><p>ON1 Balance</p><div id="b">0.000</div><button id="btn">TAP TO MINE</button><p id="t"></p><a href="#" onclick="out()" style="color:red">Logout</a></div>
<script>
try{
let u=JSON.parse(localStorage.getItem('on1u')||'null');
if(!u){alert('Login first');location.href='login.html'}
if(u.b==null)u.b=0;if(u.lm==null)u.lm=0;
document.getElementById('w').innerText='Welcome '+u.name;
document.getElementById('u').innerText=u.user;
document.getElementById('r').innerText=u.ref;
document.getElementById('b').innerText=parseFloat(u.b).toFixed(3);
function save(){let users=JSON.parse(localStorage.getItem('on1users')||'[]');let i=users.findIndex(x=>x.user==u.user);users[i]=u;localStorage.setItem('on1users',JSON.stringify(users));localStorage.setItem('on1u',JSON.stringify(u))}
function timer(){let d=24-((Date.now()-u.lm)/1000/60/60);document.getElementById('btn').disabled=d>0;document.getElementById('t').innerText=d>0?'Next in: '+d.toFixed(1)+'h':'Ready to Mine'}
document.getElementById('btn').onclick=function(){u.b+=0.001;u.lm=Date.now();document.getElementById('b').innerText=u.b.toFixed(3);save();timer()}
function out(){localStorage.removeItem('on1u');location.href='login.html'}
timer();setInterval(timer,60000)
}catch(e){document.body.innerHTML='<h2 style="color:red">ERROR: '+e.message+'</h2><p>Clear cache and try again</p>'}
</script></body></html>
