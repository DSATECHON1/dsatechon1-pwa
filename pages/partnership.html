<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Partnership & Activities — ON1Ecosystem</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #ffffff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1050px, 94%);
      margin: auto;
    }

    header {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(7,17,31,0.96);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border-radius: 10px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-links a {
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 13px;
      color: #b9c5d6;
      background: rgba(255,255,255,0.04);
    }

    .nav-links a:hover {
      background: rgba(255,255,255,0.09);
      color: #fff;
    }

    main {
      padding: 28px 0 50px;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      font-size: clamp(25px, 5vw, 38px);
      margin-bottom: 8px;
    }

    .page-title p {
      color: #93a2b7;
      line-height: 1.5;
      font-size: 14px;
    }

    .card {
      background: #0c192a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.16);
    }

    .section-title {
      font-size: 19px;
      margin-bottom: 6px;
    }

    .section-subtitle {
      color: #8fa0b7;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 17px;
    }

    /* XP */

    .xp-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: center;
    }

    .xp-number {
      font-size: 34px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .level-text {
      color: #aebbd0;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #17263a;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #35d39a;
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #8494aa;
      font-size: 12px;
      margin-top: 7px;
    }

    .xp-badge {
      min-width: 120px;
      text-align: center;
      padding: 18px 12px;
      border-radius: 14px;
      background: #101f32;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .xp-badge strong {
      display: block;
      font-size: 27px;
      margin-bottom: 4px;
    }

    .xp-badge span {
      color: #8fa0b7;
      font-size: 12px;
    }

    /* STREAK */

    .streak-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 16px;
    }

    .streak-number {
      font-size: 28px;
      font-weight: 800;
    }

    .streak-label {
      color: #8fa0b7;
      font-size: 12px;
      margin-top: 3px;
    }

    .streak-note {
      color: #8fa0b7;
      font-size: 12px;
      text-align: right;
      max-width: 230px;
      line-height: 1.4;
    }

    .streak-days {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 7px;
    }

    .day {
      min-height: 68px;
      background: #101f32;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
    }

    .day-number {
      font-size: 11px;
      color: #8494aa;
      margin-bottom: 7px;
    }

    .day-reward {
      font-size: 12px;
      font-weight: 700;
    }

    .day.done {
      border-color: rgba(53,211,154,0.45);
      background: rgba(53,211,154,0.08);
    }

    .day.current {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.25);
    }

    .day.future {
      opacity: 0.75;
    }

    /* CPX */

    .cpx-card {
      border-color: rgba(53,211,154,0.22);
    }

    .cpx-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(53,211,154,0.09);
      color: #68e4b2;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #35d39a;
    }

    .cpx-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 15px 0;
    }

    .info-box {
      background: #101f32;
      border-radius: 11px;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .info-box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .info-box span {
      color: #8798ae;
      font-size: 11px;
      line-height: 1.4;
    }

    .button {
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 13px;
      color: #06131f;
      background: #35d39a;
    }

    .button:hover {
      opacity: 0.9;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cpx-loading {
      padding: 30px 15px;
      text-align: center;
      color: #8fa0b7;
      display: none;
    }

    .cpx-error {
      display: none;
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      background: rgba(255,80,80,0.08);
      border: 1px solid rgba(255,80,80,0.2);
      color: #ff9d9d;
      font-size: 13px;
      line-height: 1.5;
    }

    .cpx-wall {
      display: none;
      margin-top: 18px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
    }

    .cpx-wall iframe {
      display: block;
      width: 100%;
      min-height: 900px;
      border: 0;
      background: #ffffff;
    }

    .open-wall {
      display: none;
      margin-top: 10px;
    }

    /* COMING SOON */

    .coming-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .coming-box {
      background: #101f32;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 15px;
    }

    .coming-box h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .coming-box p {
      color: #8191a7;
      font-size: 12px;
      line-height: 1.5;
    }

    .soon {
      display: inline-block;
      margin-top: 9px;
      font-size: 10px;
      font-weight: 700;
      color: #aab7c9;
      background: rgba(255,255,255,0.06);
      padding: 5px 7px;
      border-radius: 6px;
    }

    /* DAILY */

    .daily-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .daily-item {
      background: #101f32;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .daily-item strong {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .daily-item span {
      color: #6de1b0;
      font-weight: 700;
      font-size: 12px;
    }

    .daily-item small {
      display: block;
      color: #74859c;
      font-size: 10px;
      margin-top: 6px;
    }

    /* LOGIN */

    .login-message {
      display: none;
      text-align: center;
      padding: 35px 15px;
      color: #9aabc0;
    }

    footer {
      padding: 25px 0 35px;
      text-align: center;
      color: #64758c;
      font-size: 11px;
    }

    @media (max-width: 750px) {
      .xp-grid {
        grid-template-columns: 1fr;
      }

      .xp-badge {
        width: 100%;
      }

      .streak-days {
        grid-template-columns: repeat(5, 1fr);
      }

      .cpx-info,
      .coming-grid,
      .daily-list {
        grid-template-columns: 1fr;
      }

      .streak-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .streak-note {
        text-align: left;
      }

      .cpx-wall iframe {
        min-height: 850px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="../index.html" class="brand">
      <img src="../logo.png" alt="ON1Ecosystem">
      <span>ON1Ecosystem</span>
    </a>

    <nav class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="wallet.html">Wallet</a>
    </nav>

  </div>
</header>
