<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0f1a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.box{background:#111a2a;padding:30px;border-radius:20px;width:100%;max-width:420px}.logo{text-align:center}.logo img{width:70px}h2{color:#087cff;text-align:center;margin:20px 0}input{width:100%;padding:14px;margin:10px 0;background:#0a0f1a;border:1px solid #1a2332;border-radius:10px;color:#fff}.btn{width:100%;padding:16px;margin-top:15px;background:#087cff;color:#fff;border:none;border-radius:10px;font-weight:bold}</style></head><body><div class="box"><div class="logo"><img src="../logo.png"></div><h2>Welcome Back</h2>
<form id="f"><input id="user" placeholder="Username" required><input id="pass" type="password" placeholder="Password" required><button class="btn">LOGIN</button></form>
<p style="text-align:center;margin-top:15px">No account? <a href="signup.html" style="color:#087cff">Sign Up</a></p></div>
<script>document.getElementById('f').onsubmit=function(e){e.preventDefault();let users=JSON.parse(localStorage.getItem('on1users')||'[]');let u=users.find(x=>x.user.toLowerCase()==document.getElementById('user').value.toLowerCase()&&x.pass==document.getElementById('pass').value);if(u){localStorage.setItem('on1u',JSON.stringify(u));location.href='dashboard.html'}else{alert('Invalid login')}}</script></body></html>
