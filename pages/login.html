<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Login</title>
<style>body{background:#0a0f1a;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}.box{background:#111a2a;padding:30px;border-radius:15px;width:100%;max-width:400px}input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #1a2332;background:#0a0f1a;color:#fff}button{background:#087cff;border:none;font-weight:bold}</style>
</head><body><div class="box">
<img src="../logo.png" style="height:50px;display:block;margin:0 auto 20px">
<h2 style="text-align:center;color:#087cff">Sign In</h2>
<form id="f"><input id="user" placeholder="Username" required><input id="pass" type="password" placeholder="Password" required><button>LOGIN</button></form>
<p style="text-align:center"><a href="signup.html" style="color:#087cff">Create Account</a></p>
</div>
<script>
document.getElementById('f').onsubmit=function(e){
e.preventDefault();
let users=JSON.parse(localStorage.getItem('on1users')||'[]');
let u=users.find(x=>x.user==document.getElementById('user').value&&x.pass==document.getElementById('pass').value);
if(u){localStorage.setItem('on1u',JSON.stringify(u));location.href='dashboard.html'}else{alert('Wrong login')}
}
</script></body></html>
