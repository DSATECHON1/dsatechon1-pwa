<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCmmOlfLVPs3oPCmFLSl8trLKNqWlo9YKs",

    authDomain:
        "dsatechon1-c8b41.firebaseapp.com",

    projectId:
        "dsatechon1-c8b41",

    storageBucket:
        "dsatechon1-c8b41.firebasestorage.app",

    messagingSenderId:
        "5740594058",

    appId:
        "1:5740594058:web:23fbbca5392f12db863e73"

};


/* ==========================================
   INITIALIZE FIREBASE
========================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ==========================================
   PASSWORD TOGGLE
========================================== */

window.togglePassword =
function(id, button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        button.textContent = "HIDE";

    }else{

        input.type = "password";
        button.textContent = "SHOW";

    }

};


/* ==========================================
   FORM ELEMENTS
========================================== */

const form =
    document.getElementById("signupForm");

const message =
    document.getElementById("message");

const createBtn =
    document.getElementById("createBtn");


/* ==========================================
   MESSAGE FUNCTION
========================================== */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


/* ==========================================
   GENERATE ON1 ID
   EXACTLY 10 CHARACTERS

   ON1 + 7 characters
   Example:
   ON1ABC1234
========================================== */

function generateON1Id(){

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let result = "ON1";

    for(let i = 0; i < 7; i++){

        result +=
            characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );

    }

    return result;
}


/* ==========================================
   REFERRAL FROM URL
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const referralFromURL =
    params.get("ref");

if(referralFromURL){

    document.getElementById("referral").value =
        referralFromURL;

}


/* ==========================================
   SIGNUP
========================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        /* ==================================
           GET FORM VALUES
        ================================== */

        const firstName =
            document
            .getElementById("firstName")
            .value
            .trim();

        const lastName =
            document
            .getElementById("lastName")
            .value
            .trim();

        const username =
            document
            .getElementById("username")
            .value
            .trim();

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;

        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;

        const referralInput =
            document
            .getElementById("referral")
            .value
            .trim();


        /* ==================================
           CLEAR MESSAGE
        ================================== */

        message.className =
            "message";

        message.textContent =
            "";


        /* ==================================
           VALIDATION
        ================================== */

        if(!firstName || !lastName){

            showMessage(
                "Please enter your first name and last name.",
                "error"
            );

            return;

        }


        if(!username){

            showMessage(
                "Please choose a username.",
                "error"
            );

            return;

        }


        if(password.length < 8){

            showMessage(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;

        }


        if(password !== confirmPassword){

            showMessage(
                "The passwords do not match.",
                "error"
            );

            return;

        }


        /* ==================================
           DISABLE BUTTON
        ================================== */

        createBtn.disabled = true;

        createBtn.textContent =
            "CREATING ACCOUNT...";


        try{


            /* ==================================
               1. CREATE AUTH ACCOUNT
            ================================== */

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

            const user =
                userCredential.user;


            console.log(
                "Authentication account created:",
                user.uid
            );


            /* ==================================
               2. GENERATE ON1 ID

               NO FIRESTORE QUERY HERE.

               This fixes the permission error.
            ================================== */

            const on1Id =
                generateON1Id();


            console.log(
                "Generated ON1 ID:",
                on1Id
            );


            /* ==================================
               3. OPTIONAL REFERRAL

               If blank:
               referralCode = null

               We are NOT assigning the personal
               fallback account yet because its
               ON1 ID has not been supplied.
            ================================== */

            const referralCode =
                referralInput
                ? referralInput
                : null;


            /* ==================================
               4. CREATE FIRESTORE USER PROFILE
            ================================== */

            await setDoc(
                doc(db,"users",user.uid),
                {

                    /* =========================
                       IDENTITY
                    ========================= */

                    firstName:
                        firstName,

                    lastName:
                        lastName,

                    username:
                        username,

                    email:
                        email,


                    /* =========================
                       PERMANENT ON1 ID
                    ========================= */

                    on1Id:
                        on1Id,


                    /* =========================
                       WELCOME BONUS
                    ========================= */

                    balance:
                        100,

                    XP:
                        1000,

                    level:
                        0,


                    /* =========================
                       KYC
                    ========================= */

                    kycLevel:
                        0,


                    /* =========================
                       STREAK / MINING
                    ========================= */

                    streak:
                        0,

                    lastMine:
                        null,


                    /* =========================
                       REFERRAL
                    ========================= */

                    referralCode:
                        referralCode,


                    /* =========================
                       ACCOUNT STATUS
                    ========================= */

                    isAdmin:
                        false,

                    createdAt:
                        serverTimestamp()

                }
            );


            console.log(
                "Firestore profile created successfully."
            );


            /* ==================================
               5. SUCCESS
            ================================== */

            showMessage(
                "Account created successfully! " +
                "Your permanent ON1 ID is " +
                on1Id +
                ". You received 100 ON1 and 1,000 XP.",
                "success"
            );


            createBtn.textContent =
                "ACCOUNT CREATED";


            /* ==================================
               6. GO TO DASHBOARD
            ================================== */

            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                2200
            );


        }catch(error){

            console.error(
                "ON1 signup error:",
                error
            );


            let errorMessage =
                "Unable to create your account. Please try again.";


            /* =========================
               AUTH ERRORS
            ========================= */

            if(
                error.code ===
                "auth/email-already-in-use"
            ){

                errorMessage =
                    "This email is already registered. Please sign in or use another email.";

            }


            else if(
                error.code ===
                "auth/invalid-email"
            ){

                errorMessage =
                    "Please enter a valid email address.";

            }


            else if(
                error.code ===
                "auth/weak-password"
            ){

                errorMessage =
                    "Your password is too weak. Please use at least 8 characters.";

            }


            /* =========================
               FIRESTORE ERRORS
            ========================= */

            else if(
                error.code ===
                "permission-denied"
            ){

                errorMessage =
                    "Firestore permission was denied. Check your published Firestore Rules.";

            }


            else if(
                error.message &&
                error.message
                .toLowerCase()
                .includes("permission")
            ){

                errorMessage =
                    "Firestore permission was denied. Check your published Firestore Rules.";

            }


            else if(error.message){

                errorMessage =
                    error.message;

            }


            showMessage(
                errorMessage,
                "error"
            );


            createBtn.disabled = false;

            createBtn.textContent =
                "CREATE ON1 ACCOUNT";

        }

    }
);

</script>
