<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Join ON1Ecosystem</title>

<meta name="theme-color" content="#06101d">
<meta name="description"
content="Join ON1Ecosystem and receive your permanent ON1 ID, ON1Coin and XP.">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#050b13;
    --surface:#0c1624;
    --border:#1d3048;
    --blue:#087cff;
    --blue2:#3aa0ff;
    --green:#00df88;
    --text:#ffffff;
    --muted:#8ea2b8;
    --danger:#ff6075;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(8,124,255,.20),
            transparent 42%
        ),
        var(--bg);
    color:var(--text);
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}

.page{
    width:100%;
    max-width:1180px;
    margin:auto;
    padding:20px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:45px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand img{
    width:42px;
    height:42px;
    object-fit:contain;
}

.brand-text strong{
    display:block;
    font-size:18px;
}

.brand-text strong span{
    color:var(--blue2);
}

.brand-text small{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:9px;
    letter-spacing:.5px;
}

.login-link{
    border:1px solid var(--border);
    background:rgba(12,22,36,.75);
    padding:10px 15px;
    border-radius:10px;
    color:#dce8f5;
    font-size:12px;
    font-weight:700;
}

.login-link:hover{
    border-color:var(--blue);
}

/* MAIN */

.main{
    display:grid;
    grid-template-columns:1fr 450px;
    gap:55px;
    align-items:center;
}

.intro{
    max-width:600px;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 11px;
    border-radius:30px;
    background:rgba(8,124,255,.08);
    border:1px solid rgba(8,124,255,.25);
    color:var(--blue2);
    font-size:10px;
    font-weight:800;
    letter-spacing:.6px;
    text-transform:uppercase;
}

.eyebrow-dot{
    width:6px;
    height:6px;
    background:var(--green);
    border-radius:50%;
    box-shadow:0 0 9px rgba(0,223,136,.7);
}

.intro h1{
    margin-top:20px;
    font-size:clamp(35px,5vw,58px);
    line-height:1.05;
    letter-spacing:-2px;
}

.intro h1 span{
    color:var(--blue2);
}

.intro-text{
    max-width:520px;
    margin-top:18px;
    color:var(--muted);
    font-size:15px;
    line-height:1.7;
}

/* BENEFITS */

.benefits{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
    margin-top:28px;
}

.benefit{
    padding:15px;
    border-radius:14px;
    background:rgba(12,22,36,.72);
    border:1px solid var(--border);
}

.benefit-icon{
    width:32px;
    height:32px;
    display:grid;
    place-items:center;
    background:rgba(8,124,255,.09);
    border-radius:9px;
    margin-bottom:10px;
    font-size:16px;
}

.benefit strong{
    display:block;
    font-size:12px;
}

.benefit p{
    margin-top:5px;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
}

/* SIGNUP CARD */

.signup-card{
    background:rgba(12,22,36,.94);
    border:1px solid var(--border);
    border-radius:23px;
    padding:28px;
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.card-header{
    margin-bottom:22px;
}

.card-header h2{
    font-size:23px;
}

.card-header p{
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

    margin-top:16px;
