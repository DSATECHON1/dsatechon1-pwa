<script>
document.getElementById('signupForm').addEventListener('submit', function(e){
  e.preventDefault();
  
  let referral = document.getElementById('referral').value.trim();
  if(referral === ""){
    referral = "DSATECHON1";
    document.getElementById('referral').value = "DSATECHON1";
  }
  
  if(document.getElementById('password').value !== document.getElementById('confirm').value){
    alert("Passwords do not match!");
    return;
  }

  // GET EXISTING USERS OR CREATE NEW ARRAY
  let users = JSON.parse(localStorage.getItem('on1users')) || [];
  
  // CHECK IF USERNAME ALREADY EXISTS
  if(users.find(u => u.username === document.getElementById('username').value)){
    alert("Username already taken! Choose another.");
    return;
  }

  // CREATE NEW USER
  let newUser = {
    fullname: document.getElementById('fullname').value,
    username: document.getElementById('username').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value, // In real app we will encrypt this
    referral: referral,
    balance: 0,
    lastMine: 0
  };
  
  users.push(newUser);
  localStorage.setItem('on1users', JSON.stringify(users));
  
  // ALSO SAVE AS "CURRENT USER"
  localStorage.setItem('on1current', JSON.stringify(newUser));

  alert('Account Created! Referred by: ' + referral);
  window.location.href = 'dashboard.html';
});
</script>
