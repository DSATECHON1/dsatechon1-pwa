<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ON1 Wallet</title>

  <style>
    :root{
      --bg:#050b13;
      --surface:#0c1624;
      --surface2:#101d2d;
      --border:#1d3048;
      --blue:#087cff;
      --blue2:#3aa0ff;
      --green:#00df88;
      --gold:#f5c451;
      --text:#ffffff;
      --muted:#8ea2b8;
      --danger:#ff6075;
    }

    *{
      box-sizing:border-box;
    }

    html{
      background:#050b13;
    }

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at top right, rgba(8,124,255,.10), transparent 32%),
        radial-gradient(circle at bottom left, rgba(0,223,136,.06), transparent 30%),
        #050b13;
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    .page{
      width:100%;
      max-width:1100px;
      margin:0 auto;
      padding:15px;
    }

    /* ================= HEADER ================= */

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:5px 0 20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand img{
      width:43px;
      height:43px;
      object-fit:contain;
      border-radius:10px;
    }

    .brand-name{
      color:#fff;
      font-size:20px;
      font-weight:800;
      line-height:1.1;
    }

    .brand-sub{
      color:var(--muted);
      font-size:10px;
      font-weight:700;
      letter-spacing:1px;
      margin-top:4px;
    }

    .home-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:5px;

      padding:10px 14px;

      border:1px solid var(--border);
      border-radius:10px;

      background:var(--surface);
      color:#fff;

      text-decoration:none;
      font-size:13px;
      font-weight:700;

      transition:.2s;
    }

    .home-btn:hover{
      border-color:var(--blue);
      background:#10243a;
    }

    /* ================= TITLE ================= */

    .title-section{
      margin:3px 0 18px;
    }

    .title-section h1{
      margin:0;
      font-size:28px;
      font-weight:800;
    }

    .title-section p{
      margin:7px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    /* ================= ERROR ================= */

    #errorBox{
      display:none;

      margin-bottom:18px;
      padding:14px;

      border:1px solid rgba(255,96,117,.35);
      border-radius:12px;

      background:rgba(255,96,117,.08);
      color:#fff;

      font-size:13px;
    }

    /* ================= BALANCE GRID ================= */

    .balance-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:15px;
      margin-bottom:18px;
    }

    .balance-card{
      position:relative;
      overflow:hidden;

      min-height:150px;

      padding:20px;

      border:1px solid var(--border);
      border-radius:17px;

      background:
        linear-gradient(145deg,rgba(16,29,45,.98),rgba(8,18,30,.98));

      box-shadow:
        0 10px 30px rgba(0,0,0,.22);
    }

    .balance-card::before{
      content:"";

      position:absolute;

      width:130px;
      height:130px;

      right:-55px;
      top:-55px;

      border-radius:50%;

      background:rgba(8,124,255,.10);
    }

    .balance-card.xp::before{
      background:rgba(245,196,81,.10);
    }

    .balance-card::after{
      content:"";

      position:absolute;

      left:0;
      right:0;
      bottom:0;

      height:3px;

      background:var(--blue);
    }

    .balance-card.xp::after{
      background:var(--gold);
    }

    .balance-icon{
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      margin-bottom:13px;

      border-radius:12px;

      background:rgba(8,124,255,.13);
      border:1px solid rgba(8,124,255,.25);

      color:var(--blue2);

      font-size:21px;
      font-weight:800;
    }

    .xp .balance-icon{
      background:rgba(245,196,81,.12);
      border-color:rgba(245,196,81,.25);
      color:var(--gold);
    }

    .balance-label{
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.7px;
      margin-bottom:7px;
    }

    .balance-value-row{
      display:flex;
      align-items:baseline;
      gap:6px;
    }

    .balance-value{
      color:#fff;
      font-size:31px;
      line-height:1;
      font-weight:900;
    }

    .balance-unit{
      color:var(--blue2);
      font-size:13px;
      font-weight:800;
    }

    .xp .balance-unit{
      color:var(--gold);
    }

    /* ================= SECTIONS ================= */

    .section{
      margin-bottom:18px;

      padding:18px;

      border:1px solid var(--border);
      border-radius:16px;

      background:
        linear-gradient(145deg,rgba(12,22,36,.98),rgba(8,17,29,.98));

      box-shadow:0 8px 25px rgba(0,0,0,.18);
    }

    .section-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

      margin-bottom:14px;
    }

    .section-title-wrap{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .section-icon{
      width:37px;
      height:37px;

      display:flex;
      align-items:center;
      justify-content:center;

      flex-shrink:0;

      border-radius:10px;

      background
