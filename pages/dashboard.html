/* =====================================================
   REAL XP HISTORY - FIRESTORE
===================================================== */
async function loadRealXPHistory(uid) {
    const recentXpList = document.getElementById("recentXpList");
    if(!recentXpList) return;
    
    try {
        const q = query(collection(db, "users", uid, "xpHistory"), orderBy("createdAt", "desc"), limit(5));
        const snapshot = await getDocs(q);
        
        if(snapshot.empty) {
            recentXpList.innerHTML = "No XP activity yet";
            return;
        }
        
        recentXpList.innerHTML = snapshot.docs.map(doc => {
            const d = doc.data();
            const time = d.createdAt?.toDate? new Date(d.createdAt.toDate()).toLocaleString() : 'Just now';
            return `
                <div style="display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(29,48,72,.3);">
                    <span>${d.source}</span>
                    <span style="color:var(--blue2); font-weight:700;">+${d.xp} XP</span>
                </div>
            `;
        }).join("");
    } catch(e) {
        console.error("XP History Error:", e);
        recentXpList.innerHTML = "Unable to load history";
    }
}

async function logRealXP(uid, xp, source) {
    try {
        await addDoc(collection(db, "users", uid, "xpHistory"), {
            xp: xp,
            source: source,
            createdAt: serverTimestamp()
        });
    } catch(e) {
        console.error("Failed to log XP:", e);
    }
}


/* =====================================================
   CPX SURVEY INTEGRATION
===================================================== */
function loadCPXSurveys(user, data){
    if(!user) return;
    const cpxContainer = document.getElementById("cpx-surveys");
    if(!cpxContainer) return;
    window.config = undefined;
    const extUserId = String(user.uid);
    const username = String(data?.username || user.displayName || "Member");
    const email = String(data?.email || user.email || "");

    const script3 = { div_id: "cpx-surveys", theme_style: 3, display_mode: 1 };

    window.config = {
        general_config: {
            app_id: CPX_APP_ID,
            ext_user_id: extUserId,
            email: email,
            username: username,
            secure_hash: CPX_SECURE_HASH,
            subid_1: "ON1Ecosystem",
            subid_2: ""
        },
        style_config: {
            text_color: "#dce8f5",
            survey_box: { topbar_background_color: "#087cff", box_background_color: "#0c1624", rounded_borders: true, stars_filled: "#f5c451" }
        },
        script_config: [script3],
        debug: false,
        useIFrame: true,
        iFramePosition: 1,
        functions: {
            no_surveys_available: () => {
                if(cpxLoading) cpxLoading.textContent = "No matching surveys are available right now. Please check again later.";
            },
            count_new_surveys: (countsurveys) => {
                if(cpxLoading) {
                    if(Number(countsurveys) > 0) { cpxLoading.style.display = "none"; }
                    else { cpxLoading.textContent = "No matching surveys are available right now."; }
                }
            },
            get_all_surveys: (surveys) => {
                if(cpxLoading) cpxLoading.style.display = "none";
            },
            get_transaction: async (transactions) => { // CHANGED: added async
                console.log("CPX transaction:", transactions);
                if(transactions && transactions.length > 0) {
                    const tx = transactions[0];
                    if(tx.status === 1) { // 1 = completed
                        const usd = Number(tx.amount_usd || tx.amount || 0);
                        const xp = Math.floor(usd * 250); // $1 = 250 XP
                        if(xp > 0 && currentUser) {
                            await logRealXP(currentUser.uid, xp, `CPX Survey $${usd.toFixed(2)}`);
                            await loadRealXPHistory(currentUser.uid); // refresh list
                        }
                    }
                }
            }
        }
    };

    const existing = document.getElementById("cpx-script-tag");
    if(existing) existing.remove();
    const script = document.createElement("script");
    script.id = "cpx-script-tag";
    script.type = "text/javascript";
    script.src = "https://cdn.cpx-research.com/assets/js/script_tag_v2.0.js";
    script.onload = function(){ if(cpxLoading) cpxLoading.style.display = "none"; };
    script.onerror = function(){ if(cpxLoading) cpxLoading.textContent = "Survey service is temporarily unavailable. Please try again later."; };
    document.body.appendChild(script);
}

async function loadUser(user){
    const userRef = doc(db, "users", user.uid);
    const snapshot = await getDoc(userRef);
    if(!snapshot.exists()){ throw new Error("Your ON1 profile could not be found."); }
    const data = snapshot.data();
    updateDashboard(data);
    loadCPXSurveys(user, data);
    loadRealXPHistory(user.uid); // NEW: load history on login
}
