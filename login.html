<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - DSATECHON1</title>
  <style>
    body{background:#0a0f1a; color:#fff; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px;}
    .card{background:#111a2a; padding:40px; border-radius:15px; width:100%; max-width:400px; border:1px solid #1a2332;}
    input{width:100%; padding:12px; margin:10px 0; background:#0a0f1a; border:1px solid #1a2332; border-radius:8px; color:#fff; box-sizing:border-box;}
    .btn{width:100%; padding:15px; background:#087cff; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;}
    .btn:hover{background:#0066cc;}
  </style>
</head>
<body>
  <div class="card">
    <img src="../logo.png" style="height:50px; display:block; margin:0 auto 20px;">
    <h2 style="text-align:center; color:#087cff;">Sign In</h2>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" placeholder="Enter username" required>
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
      <button class="btn">LOGIN</button>
    </form>
    <p style="text-align:center; margin-top:15px;"><a href="signup.html" style="color:#087cff;">Don't have account? Sign Up</a></p>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  
  let username = document.getElementById('username').value;
  let password = document.getElementById('password').value;
  
  let users = JSON.parse(localStorage.getItem('on1users')) || [];
  
  // FIND USER
  let user = users.find(u => u.username === username && u.password === password);
  
  if(user){
    // SAVE AS CURRENT LOGGED IN USER
    localStorage.setItem('on1current', JSON.stringify(user));
    alert('Login Successful! Welcome @' + user.username);
    window.location.href = 'dashboard.html';
  } else {
    alert('Invalid Username or Password!');
  }
});
</script>
</body>
</html>
